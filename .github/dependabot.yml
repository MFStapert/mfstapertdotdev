version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular-analog:
        patterns:
          - '@angular/*'
          - '@analogjs/*'
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@analogjs/*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@angular/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@analogjs/*'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch

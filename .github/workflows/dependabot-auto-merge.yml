name: Dependabot auto-merge

# Runs after CI on a Dependabot branch. No pull_request trigger, so this
# workflow does not appear as a check on pull requests. It never checks out
# code. fetch-metadata only works on pull_request, so the bump is read from
# the PR title and body.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - dependabot/**

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge patch and minor Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          pr_number="$(printf '%s' "$PR_JSON" | jq -r '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -z "$pr_number" ]; then
            echo "No open pull request for ${HEAD_BRANCH}."
            exit 0
          fi

          pr="$(gh pr view "$pr_number" --repo "$REPO" --json title,body,author,url)"
          author="$(printf '%s' "$pr" | jq -r '.author.login')"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "Pull request author is ${author}, not dependabot[bot]."
            exit 0
          fi

          title="$(printf '%s' "$pr" | jq -r '.title')"
          body="$(printf '%s' "$pr" | jq -r '.body // ""')"
          url="$(printf '%s' "$pr" | jq -r '.url')"
          update_type="$(
            TITLE="$title" BODY="$body" python3 - <<'PY'
          import os, re

          rank = {"patch": 1, "minor": 2, "major": 3}

          def parts(value):
              value = value.lstrip("vV").split("+", 1)[0]
              numbers = []
              for piece in value.split("."):
                  match = re.match(r"(\d+)", piece)
                  if not match:
                      break
                  numbers.append(int(match.group(1)))
              return (numbers + [0, 0, 0])[:3]

          def classify(old, new):
              before, after = parts(old), parts(new)
              if after[0] != before[0]:
                  return "major"
              if after[1] != before[1]:
                  return "minor"
              return "patch"

          text = os.environ["TITLE"] + "\n" + os.environ["BODY"]
          # Release notes inside <details> mention unrelated bumps.
          text = re.sub(r"<details[\s\S]*?</details>", " ", text, flags=re.I)
          pairs = re.findall(
              r"from\s+v?(\d+(?:\.\d+){0,3}(?:[-+][0-9A-Za-z.-]+)?)\s+to\s+v?(\d+(?:\.\d+){0,3}(?:[-+][0-9A-Za-z.-]+)?)",
              text,
              flags=re.I,
          )
          if not pairs:
              print("unknown")
          else:
              print(max((classify(old, new) for old, new in pairs), key=rank.get))
          PY
          )"

          echo "PR ${url} update type: ${update_type}"
          case "$update_type" in
            patch|minor)
              # CI already succeeded. --auto still waits for any other required
              # checks or reviews instead of merging past branch protection.
              gh pr merge "$pr_number" --repo "$REPO" --squash --auto
              ;;
            major)
              echo "Major update. Leaving the pull request for review."
              ;;
            *)
              echo "Could not tell the update type. Leaving the pull request for review."
              ;;
          esac
